<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>RPG Combat Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Simulador de Combate</h1>
        
        <label>Escolha sua Classe:</label>
        <select id="classe">
            <option value="Guerreiro">Guerreiro</option>
            <option value="Mago">Mago</option>
            <option value="Arqueiro">Arqueiro</option>
        </select>

        <label>Sua Arma:</label>
        <input type="text" id="arma" placeholder="Ex: Espada, Cajado, Arco...">

        <button onclick="lutar()">Lutar!</button>

        <div id="resultado" class="resultado">
            O desfecho aparecerá aqui...
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
